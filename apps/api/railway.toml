# Sahaj API — Railway deployment config
[build]
builder = "NIXPACKS"
buildCommand = "pnpm --filter @sahaj/shared build && pnpm --filter @sahaj/api build"

[deploy]
startCommand = "node apps/api/dist/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[services]]
name = "sahaj-api"
