services:
  # ─────────────────────────────────────────────
  # MongoDB (always started)
  # ─────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: sahaj-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: sahaj
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis (optional — start with: docker compose --profile redis up)
  # ─────────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: sahaj-redis
    restart: unless-stopped
    profiles: ["redis", "full"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─────────────────────────────────────────────
  # Sahaj API (Fastify)
  # ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sahaj-api
    restart: unless-stopped
    profiles: ["app", "full"]
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/sahaj
      DEMO_MODE: mock
      API_PORT: "3001"
      API_HOST: "0.0.0.0"
      CORS_ORIGINS: "http://localhost:3000"
      SESSION_SECRET: "dev-only-secret-change-in-prod"
      REDIS_URL: ${REDIS_URL:-}
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Sahaj Web (Next.js)
  # ─────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sahaj-web
    restart: unless-stopped
    profiles: ["app", "full"]
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:3001
      NODE_ENV: development
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy

  # ─────────────────────────────────────────────
  # n8n (optional automation — start with: docker compose --profile n8n up)
  # ─────────────────────────────────────────────
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: sahaj-n8n
    restart: unless-stopped
    profiles: ["n8n", "full"]
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: sahaj-demo
      WEBHOOK_URL: http://localhost:5678
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/home/node/workflows

volumes:
  mongo-data:
  redis-data:
  n8n-data:
